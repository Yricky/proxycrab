name: Build Artifacts

on:
  push:
    branches:
      - "build/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact suffix
        id: suffix
        shell: bash
        run: |
          s="${GITHUB_REF_NAME#build/}"
          echo "s=${s//\//-}" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}

      - name: Build desktop app
        run: pnpm tauri build

      - name: Upload desktop bundles (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ steps.suffix.outputs.s }}
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload desktop bundles (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ steps.suffix.outputs.s }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload desktop bundles (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ steps.suffix.outputs.s }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact suffix
        id: suffix
        shell: bash
        run: |
          s="${GITHUB_REF_NAME#build/}"
          echo "s=${s//\//-}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.platform }}

      - name: Build frontend assets
        run: pnpm build

      - name: Build CLI
        run: cargo build --release --locked -p proxycrab-cli

      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out
          tar -czf "out/proxycrab-cli-${{ matrix.platform }}-${{ steps.suffix.outputs.s }}.tar.gz" \
            -C target/release proxycrab-cli

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Compress-Archive -Path target/release/proxycrab-cli.exe `
            -DestinationPath "out/proxycrab-cli-${{ matrix.platform }}-${{ steps.suffix.outputs.s }}.zip"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}-${{ steps.suffix.outputs.s }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [desktop, cli]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/build/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME#build/}"
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find artifacts -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          git tag --force "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$tag"
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag --title "$tag" --generate-notes
          fi
