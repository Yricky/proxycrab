[workspace]
members = ["crates/proxy-crab-mitm", "crates/proxy-crab-mgr", "src-tauri", "cli-app"]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
async-compression = { version = "0.4", features = ["tokio", "brotli", "gzip", "zlib", "zstd"] }
base64 = "0.23.1"
brotli = "9.0.0"
bytes = "1.11"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
fs2 = "0.4"
futures = "0.3"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1.8", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
if-addrs = "0.15.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send"] }
percent-encoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
regex = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = "0.23.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
serde_yaml_ng = "0.10"
sha2 = "0.10.9"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
