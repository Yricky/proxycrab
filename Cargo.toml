[workspace]
members = ["crates/proxy-crab-mitm", "crates/proxy-crab-mgr", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
async-compression = { version = "0.4", features = ["tokio", "brotli", "gzip", "zlib", "zstd"] }
base64 = "0.22"
brotli = "8"
bytes = "1.11"
flate2 = "1"
fs2 = "0.4"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1.8", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["full"] }
if-addrs = "0.15.0"
mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = "0.23.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1.52", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "1"
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
